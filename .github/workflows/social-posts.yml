name: Generate social posts

on:
  pull_request:
    paths:
      - data/svoz_exceptions.json
      - svoz_exceptions.py
      - streets.py
      - social_post.py
      - scripts/generate_social_posts.py
      - scripts/validate_project.py
      - tests.py
      - requirements.txt
      - resources/fonts/**
      - resources/branding/litovle_logo_current.png
      - .github/workflows/social-posts.yml
  push:
    branches:
      - main
    paths:
      - data/svoz_exceptions.json
      - svoz_exceptions.py
      - streets.py
      - social_post.py
      - scripts/generate_social_posts.py
      - scripts/validate_project.py
      - tests.py
      - requirements.txt
      - resources/fonts/**
      - resources/branding/litovle_logo_current.png
      - .github/workflows/social-posts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate project
        run: python scripts/validate_project.py

      - name: Generate Facebook graphics
        run: python scripts/generate_social_posts.py --all

      - name: Upload graphics
        uses: actions/upload-artifact@v6
        with:
          name: waste-collection-social-posts
          path: _social/*.png
          if-no-files-found: error
